name: Morbius GHL sync

# 2026-11-07: Morbius keeps Tala's Unstuck Homes GHL in step with the master
# lead list (new / update / retrace / delete). Run by hand:
#   live = false -> practice run, nothing written to GHL
#   limit        -> max NEW contacts this run (0 = update only, -1 = no limit)
# Every morning at 7:47am ET (after the 5am crawler and Morbius's 7:13am
# stories) it runs LIVE with no limit on new leads. Logs show counts only.

# 2026-11-08: GitHub starts this repo's scheduled runs 5-7 hours late, so the
# sync now starts the moment the nightly crawler finishes (workflow_run). The
# 7:47am schedule stays only as a backup in case the crawler doesn't run.
# Morbius's 8:19am task also starts this sync itself if it hasn't run today.
on:
  workflow_run:
    workflows: ["Nightly Greenville lead ingest"]
    types: [completed]
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Write to GHL? (false = practice run)"
        type: boolean
        default: false
      limit:
        description: "Max new contacts this run (0 = none, update only; -1 = no limit)"
        type: string
        default: "10"

concurrency:
  group: morbius
  cancel-in-progress: false

# 2026-11-12: the job reads the Actions list to see whether the crawler is running.
permissions:
  contents: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # 2026-11-12 (Tala's call): never write the leads table while the nightly
      # crawler is running -- that overlap caused the Nov 11 deadlock. If the
      # crawler is queued or running, this sync stops here; a fresh sync starts
      # on its own the moment the crawler finishes (workflow_run above).
      - name: Skip if the nightly crawler is running
        id: crawler
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          busy=$(gh run list -R "$REPO" -w nightly.yml -L 5 --json status \
                 --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length' || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then
            echo "Nightly crawler is running -- skipping this sync; it starts again when the crawler finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.crawler.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.crawler.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.crawler.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install requests==2.32.3 psycopg2-binary==2.9.9 openpyxl==3.1.5
      # 2026-11-11 (Tala's training): before scoring, check whether each tax-sale
      # lead's delinquent year has been PAID since the sale (likely redeemed).
      - name: Install headless browser
        if: steps.crawler.outputs.skip != 'true'
        run: playwright install --with-deps chromium
      - name: Tax paid check
        if: steps.crawler.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/tax_paid_check.py
      - name: Morbius sync
        if: steps.crawler.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHL_MORBIUS_TOKEN: ${{ secrets.GHL_MORBIUS_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: |
          cd scripts
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ inputs.live }}" = "true" ]; then LIVE="--live"; else LIVE=""; fi
          LIMIT="${{ inputs.limit }}"; [ -z "$LIMIT" ] && LIMIT="-1"
          python morbius_sync.py $LIVE --limit "$LIMIT"

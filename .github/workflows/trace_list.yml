name: Build skip-trace list (on demand)

# 2026-11-15 (Tala): retraces of GHL leads whose info changed, then the best new leads.
# Writes only the private trace_list_export table (no artifacts: the repo is public).
on:
  push:
    branches: [feat/trace-list]
  workflow_dispatch:
    inputs:
      new_amount:
        description: "How many new leads"
        default: "150"

concurrency:
  group: leads-database
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary requests openpyxl==3.1.5
      - name: Build list
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEW_AMOUNT: ${{ inputs.new_amount || '150' }}
        run: cd scripts && python build_trace_list.py

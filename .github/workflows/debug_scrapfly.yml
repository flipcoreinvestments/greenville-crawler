name: Debug foreclosure_mie via Scrapfly (throwaway)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run foreclosure (Master-in-Equity) ingest via Scrapfly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
        run: python scripts/foreclosure_mie_ingest.py

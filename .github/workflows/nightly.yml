name: Nightly Greenville lead ingest

# NOTE: foreclosure_mie ingest moved to its own weekly workflow
# (weekly_foreclosure.yml) on 2026-09-23. It's the only source that costs
# real money (Scrapfly residential-proxy credits, ~150/run) and foreclosure
# sale dates don't change daily, so running it nightly just burns the free
# 1,000-credit tier in about a week for no benefit. Weekly stretches that to
# 6-7 weeks. Every other source below is free regardless of frequency.

on:
  schedule:
    # 10:00 UTC ≈ 6:00 AM Eastern (5:00 AM during EST). Runs every night.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      max_rows:
        description: "Optional: limit how many parcels to process (leave blank for all)"
        required: false

# 2026-09-30: every source step has `if: !cancelled()` -- if one county
# site is down, the other sources, the merge and the call-list export still
# run. The run still shows red so the failure is visible.
# Only one workflow touches the database at a time (added 2026-10-01): the
# Sep 28 weekly foreclosure run started while the nightly run held the leads
# table and died on a statement timeout. A second run now waits its turn.
concurrency:
  group: leads-database
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser
        run: playwright install --with-deps chromium

      - name: Run tax sale ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_ROWS: ${{ github.event.inputs.max_rows }}
        run: python scripts/tax_sale_ingest.py

      - name: Run tax sale redemption period ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_ROWS: ${{ github.event.inputs.max_rows }}
        run: python scripts/redemption_period_ingest.py

      - name: Run building permits (expired/demolition) ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/building_permits_ingest.py

      - name: Run absentee owner + tired landlord ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/absentee_owner_ingest.py

      - name: Backfill land_use for every lead (property type filter coverage)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_land_use.py

      - name: Run probate ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_ROWS: ${{ github.event.inputs.max_rows }}
        run: python scripts/probate_ingest.py

      - name: Run code enforcement (unfit structures) ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/code_enforcement_ingest.py

      - name: Import PropStream exports (private Supabase bucket)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/propstream_import.py

      - name: Fill property city/zip (U.S. Census geocoder, for skip tracing)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fill_city_zip.py

      - name: Merge duplicate-address leads (one name per list)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/merge_duplicate_addresses.py

      - name: Alert on leads newly stacked on 2+ lists
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/alert_stacked_leads.py

      - name: Write call lists + system health (private Supabase bucket lead-exports)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/export_call_lists.py

name: Nightly Greenville lead ingest

# NOTE: foreclosure_mie ingest moved to its own weekly workflow
# (weekly_foreclosure.yml) on 2026-09-23. It's the only source that costs
# real money (Scrapfly residential-proxy credits, ~150/run) and foreclosure
# sale dates don't change daily, so running it nightly just burns the free
# 1,000-credit tier in about a week for no benefit. Weekly stretches that to
# 6-7 weeks. Every other source below is free regardless of frequency.

on:
  schedule:
    # 10:00 UTC ≈ 6:00 AM Eastern (5:00 AM during EST). Runs every night.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      max_rows:
        description: "Optional: limit how many parcels to process (leave blank for all)"
        required: false

# 2026-09-30: every source step has `if: !cancelled()` -- if one county
# site is down, the other sources, the merge and the call-list export still
# run. The run still shows red so the failure is visible.
# Only one workflow touches the database at a time (added 2026-10-01): the
# Sep 28 weekly foreclosure run started while the nightly run held the leads
# table and died on a statement timeout. A second run now waits its turn.
concurrency:
  group: leads-database
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 2026-10-19: write access lets the last step publish the watchdog status file
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser
        run: playwright install --with-deps chromium

      - name: Run tax sale ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_ROWS: ${{ github.event.inputs.max_rows }}
        run: python scripts/tax_sale_ingest.py

      - name: Run tax sale redemption period ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_ROWS: ${{ github.event.inputs.max_rows }}
        run: python scripts/redemption_period_ingest.py

      - name: Run building permits (expired/demolition) ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/building_permits_ingest.py

      - name: Run absentee owner + tired landlord ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/absentee_owner_ingest.py

      - name: Backfill land_use for every lead (property type filter coverage)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_land_use.py

      - name: Run probate ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_ROWS: ${{ github.event.inputs.max_rows }}
        run: python scripts/probate_ingest.py

      - name: Run code enforcement (unfit structures) ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/code_enforcement_ingest.py

      - name: Import PropStream exports (private Supabase bucket)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/propstream_import.py

      - name: Fill property city/zip (U.S. Census geocoder, for skip tracing)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fill_city_zip.py

      - name: Merge duplicate-address leads (one name per list)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/merge_duplicate_addresses.py

      - name: Alert on leads newly stacked on 2+ lists
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/alert_stacked_leads.py

      # 2026-10-11: reads the skip-trace result files she uploads to the
      # private skiptrace-results bucket and marks each lead traced / not traced.
      - name: Import skip-trace results (private Supabase bucket skiptrace-results)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/skiptrace_intake.py

      # 2026-10-16: reads the newest GHL contact export she drops in the
      # private ghl-sync bucket -- which phone each GHL contact has, which
      # contacts are gone, and "wrong number" / "wrong person" tags from calls.
      - name: GHL sync (private Supabase bucket ghl-sync)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ghl_sync.py

      # 2026-10-11: re-checks the last 1,000 leads + every skip-traced lead;
      # marks sold/off-list leads DEAD and bad-data leads WRONG INFORMATION
      # so the export keeps them out of the skip-trace lists.
      - name: Nightly QA check (dead / wrong information)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/qa_check.py

      # 2026-10-11: second QA on not-traced leads (fixed vs needs a person),
      # errors on already-pulled leads (count-only warning for the watchdog),
      # repeat offenders.
      - name: Skip-trace follow-up (fixed / needs human / errors / repeat offenders)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/skiptrace_followup.py | tee followup.log

      # 2026-10-13: checks every skip-traced phone against the Do Not Call
      # registry files she uploads monthly (private bucket dnc-registry) and
      # her opt-out list; only clean phones go on text_ready.csv.
      - name: Do Not Call scrub (private Supabase bucket dnc-registry)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/dnc_scrub.py

      - name: Write call lists + system health (private Supabase bucket lead-exports)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/export_call_lists.py

      # 2026-10-10: fails the run (red X + GitHub failure email/push) if any
      # source didn't finish, probate is stuck, or the call lists are stale.
      - name: Health gate (alerts if anything is broken or stuck)
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/health_gate.py

      # 2026-10-19: publishes a tiny status file (pass/fail + how many pulled
      # leads changed, count only) to the watchdog-status branch. Claude's
      # daily watchdog reads it from raw.githubusercontent.com, which still
      # works when Claude's cloud blocks the GitHub API.
      - name: Publish watchdog status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ERRS=$(grep -oP 'New errors on already-pulled leads: \K[0-9]+' followup.log 2>/dev/null || echo unknown)
          mkdir -p /tmp/st && cd /tmp/st
          git init -q -b watchdog-status
          printf '{"run_id":"%s","event":"%s","status":"%s","lead_errors":"%s","finished_utc":"%s"}\n' \
            "$RUN_ID" "$EVENT" "$JOB_STATUS" "$ERRS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > status.json
          git add status.json
          git -c user.name=crawler-bot -c user.email=actions@users.noreply.github.com commit -qm "watchdog status $RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" watchdog-status

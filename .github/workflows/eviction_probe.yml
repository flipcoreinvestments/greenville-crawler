name: Eviction source probe (one-time, structure only)

# 2026-11-24 (Tala's go): finds where Greenville magistrate eviction filings are
# published. Reads page structure only. No database, no secrets, no searches.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Probe candidate sources
        run: python scripts/eviction_source_probe.py

name: Merge duplicates & alert on stacked leads (on demand)

on:
  workflow_dispatch: {}

# Only one workflow touches the database at a time (added 2026-10-01): the
# Sep 28 weekly foreclosure run started while the nightly run held the leads
# table and died on a statement timeout. A second run now waits its turn.
concurrency:
  group: leads-database
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge duplicate-address leads (one name per list)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/merge_duplicate_addresses.py

      - name: Alert on leads newly stacked on 2+ lists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/alert_stacked_leads.py
